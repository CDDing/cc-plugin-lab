name: private-marketplace-probe

# 목적: private 마켓플레이스를 CI 에서 쓰는 방법 검증.
#
# 시도 1 (실패): plugin_marketplaces 에 private 레포 URL + git credential 사전 주입.
#   액션이 실행 직전 http.https://github.com/.extraheader 로 자기 토큰을 심고
#   ("Removing existing git authentication headers..."), 마켓플레이스 레포 전용으로 더 구체적인
#   extraheader 를 걸어도 403 "Write access to repository not granted" 로 실패했다.
#   → 액션이 자체 토큰으로 클론하는 것으로 보인다. plugin_marketplaces 로는 private 접근 불가.
#
# 시도 2 (이 워크플로우): 마켓플레이스 클론을 우회한다.
#   actions/checkout 이 PAT 로 private 레포를 가져오고, 플러그인 디렉토리를 ~/.claude/skills/ 로
#   복사한다. `claude plugin init` 도움말에 따르면 그 위치의 플러그인은 <name>@skills-dir 로
#   자동 로드된다. 마켓플레이스 인증이 아예 필요 없다.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # private 레포 접근은 표준 checkout + PAT 로 처리한다.
      - name: Fetch private plugin repo
        uses: actions/checkout@v4
        with:
          repository: portal301/michelo-marketplace
          token: ${{ secrets.MKT_TOKEN }}
          path: .private-mkt

      - name: Install plugins into ~/.claude/skills
        run: |
          echo "--- private repo 가 실제로 받아졌는지 ---"
          ls .private-mkt/plugins
          mkdir -p ~/.claude/skills
          # (a) private 레포에서 온 플러그인
          cp -r .private-mkt/plugins/frontend-architecture ~/.claude/skills/frontend-architecture
          # (b) 이 레포의 프로브 플러그인 — 커맨드 호출까지 검증하기 위해 함께 심는다
          cp -r plugins/polyrepo-review ~/.claude/skills/polyrepo-review
          ls -1 ~/.claude/skills

      - name: Probe skills-dir plugins
        id: probe
        uses: anthropics/claude-code-action@v1.0.201
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /polyrepo-review:cr SKILLS-DIR

            추가로 마지막 줄에 `PRIVATE_PLUGIN = ` 을 붙이고, Bash 로
            `ls ~/.claude/skills/frontend-architecture` 결과를 한 줄로 출력한다.
          claude_args: '--model sonnet --allowedTools "Read,Bash,Glob,Agent"'

      - name: Dump probe output
        if: always()
        run: |
          f="${{ steps.probe.outputs.execution_file }}"
          echo "execution_file=$f"
          if [ ! -f "$f" ]; then echo "no execution file"; exit 0; fi
          echo "--- result ---"
          jq -r '.[] | select(.type=="result") | .result' "$f" || true
