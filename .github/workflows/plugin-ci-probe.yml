name: plugin-ci-probe

# 목적: claude-code-action 안에서 마켓플레이스 플러그인의 슬래시 커맨드가 동작하는지,
# 그리고 그 플러그인이 체크아웃된 레포의 AGENTS.md / .claude/rules/ 를 읽을 수 있는지 검증한다.
# claude-code-action 은 push 이벤트를 지원하지 않는다 ("Unsupported event type: push").
# PR 없이 돌리려면 workflow_dispatch 가 유일한 수단이다.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # id-token: write 없으면 액션이 OIDC 토큰을 못 받아 3회 재시도 후 실패한다.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Run plugin probe
        id: probe
        # v1.0.201 핀: v1.0.202 가 싣고 온 Claude Code 의 native installer 가 ~/.local/bin 을
        # 만들지 못한 채 exit 0 을 반환해 액션이 죽는 알려진 이슈를 피한다.
        # plugin_marketplaces / plugins 입력은 이 버전에도 존재한다 (action.yml:160-167).
        uses: anthropics/claude-code-action@v1.0.201
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/CDDing/cc-plugin-lab.git"
          plugins: "polyrepo-review@cc-plugin-lab"
          prompt: "/polyrepo-review:cr PR-1234"
          claude_args: '--model sonnet --allowedTools "Read,Bash,Glob,Agent"'
          # 프로브 결과를 Actions 로그에서 직접 읽기 위해 리포트 출력을 켠다.
          display_report: "true"

      # display_report 는 job summary 로만 나가서 로그 grep 이 안 된다.
      # 액션이 내주는 execution_file(전체 메시지 JSON)을 직접 덤프해 결과를 읽는다.
      - name: Dump probe output
        if: always()
        run: |
          f="${{ steps.probe.outputs.execution_file }}"
          echo "execution_file=$f"
          if [ -f "$f" ]; then
            echo "--- assistant text ---"
            python3 -c "
import json,sys
d=json.load(open('$f'))
msgs=d if isinstance(d,list) else d.get('messages',[])
for m in msgs:
    if m.get('type')=='assistant':
        for c in m.get('message',{}).get('content',[]):
            if c.get('type')=='text':
                print(c['text'])
    if m.get('type')=='result':
        print('--- result ---')
        print(m.get('result',''))
"
          else
            echo "no execution file"
          fi
